services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sloption
      POSTGRES_USER: sloption
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sloption -d sloption]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgresql://sloption:${POSTGRES_PASSWORD}@db:5432/sloption
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:?Set APP_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
